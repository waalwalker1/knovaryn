[alembic]
# Path to the migration environment (script_location is relative to this file).
script_location = migrations
# The file name of the version "head" placeholder. Busy check: with multiple
# processes this should be set to a unique value per environment.
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally NOT set here: env.py resolves the database
# URL from Knovaryn configuration (default sqlite+aiosqlite:///./.knovaryn/..,
# overridable via KNOVARYN_STORAGE_DATABASE_URL or ${ENV} placeholders) so the
# migrations always target the same database the application uses.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
