# Knovaryn security scanning (spec WP L5).
#
# Runs on every push/PR and on a weekly schedule. Scans:
#   - dependency audit (pip-audit)
#   - secret scanning (gitleaks)
#   - static security scan (bandit)
#   - container vulnerabilities + IaC/Kubernetes (Trivy)
#   - SBOM generation (anchore cycloneDX, container)
#   - license inventory
#
# Licensing note: scans report findings; non-blocking informational rows are
# logged, while HIGH vulnerabilities / leaked secrets fail the job.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"   # weekly Monday ~04:27 UTC

permissions:
  contents: read
  security-events: write   # for gitleaks SARIF upload + code scanning

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps-and-static:
    name: Dependency + static scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: uv sync --extra dev --extra mcp
      - name: pip-audit (vulnerable dependencies)
        run: uv run pip-audit
      - name: bandit static security scan (fail on HIGH)
        # bandit exits non-zero when issues are found; failing on HIGH only.
        run: uv run --with bandit bandit -r src -q -lll
      - name: License inventory
        run: uv run --with pip-licenses pip-licenses --format=plain --order=count

  container-and-iac:
    name: Container + IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t knovaryn:scan .
      # The upstream `aquasecurity/trivy-action` internally references the
      # deleted `setup-trivy@v0.2.2` tag (fails at action resolution), and the
      # maintainer `setup-trivy@v0.3.1` action self-clones the trivy repo and
      # aborts on a non-literal 'path' input in this environment (both confirmed
      # failing). Rather than fight upstream action fragility, run Trivy straight
      # from its official container image — Docker build already works here.
      - name: Trivy — container image (HIGH/CRITICAL fail)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/data" aquasecurity/trivy:0.57.1 image --format table --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed knovaryn:scan
      - name: Trivy — filesystem scan (source)
        run: docker run --rm -v "$PWD:/data" -w /data aquasecurity/trivy:0.57.1 fs --format table --exit-code 1 --severity CRITICAL,HIGH .
      - name: Trivy — IaC / Kubernetes manifests
        run: docker run --rm -v "$PWD:/data" -w /data aquasecurity/trivy:0.57.1 config --format table --exit-code 1 --severity CRITICAL,HIGH deploy/

  sbom:
    name: SBOM (cycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Generate SBOM from uv.lock
        run: |
          uv export --format requirements-txt --no-hashes -o requirements.txt
          uv run --with cyclonedx-bom cyclonedx-py -i requirements.txt -o sbom.cdx.json --format json || true
      - uses: anchore/sbom-action@v0
        with:
          path: ./
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore
