# Builds the wheel/sdist and publishes it to PyPI once a maintainer publishes
# a GitHub Release. Nothing publishes automatically on plain `main` commits —
# publishing is an explicit, release-gated action.
#
# Setup (one-time, by a maintainer):
#   1. Create a PyPI account (https://pypi.org/account/register/) and, in
#      account settings, add a token scoped to the "knovaryn" project.
#   2. Add that token as a repository secret named `PYPI_API_TOKEN`
#      (Settings > Secrets and variables > Actions).
#   3. Tag a commit and publish a GitHub Release, e.g.
#      `git tag v0.1.0 && git push origin v0.1.0` then create a GitHub Release
#      from the tag. Publishing the Release triggers the PyPI upload.

name: Publish to PyPI
on:
  release:
    types: [published]

jobs:
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: uv build
      - name: Verify metadata
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(wheel)
          meta = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
          text = z.read(meta).decode()
          assert "knovaryn" in text, "metadata missing name"
          print("OK:", wheel)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing when the project enables it
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
          # Password via OIDC trusted publishing, or this repo secret.
          password: ${{ secrets.PYPI_API_TOKEN }}
