# Builds + verifies the wheel/sdist (L7) and publishes it to PyPI via **OIDC
# trusted publishing** (L8) once a maintainer publishes a GitHub Release.
# Nothing publishes automatically on plain `main` commits — publishing is an
# explicit, release-gated action (contract rule 22).
#
# L9 release safeguards, in one pipeline:
#   - only a `release` event triggers publish (manual Release gate)
#   - the `package-ci` job runs scripts/package_ci.py (build, twine check,
#     metadata, secret-scan, clean-env install, CLI/MCP/REST smoke) and must
#     pass before anything is uploaded
#   - the tag must be a clean `vX.Y.Z` semver and match the package version
#   - any secret-like content in the wheel fails the job (fail closed)
#   - publish uses OIDC (id-token: write) — no stored password/token secret
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-ci:
    name: Package CI (L7 — build + verify release candidate)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dev + mcp extras
        run: uv sync --extra dev --extra mcp
      - name: Build + verify + smoke (wheel/sdist/twine/meta/secrets/CLI/MCP/REST)
        run: uv run python scripts/package_ci.py

  tag-version-consistency:
    name: Release tag matches package version (L9)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Check tag == project version
        run: |
          VERSION="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          REF="${GITHUB_REF#refs/tags/v}"
          echo "tag=v${REF}  project=${VERSION}"
          test "$REF" = "$VERSION" || { echo "tag does not match project version"; exit 1; }

  build:
    name: Build wheel & sdist
    needs: [package-ci, tag-version-consistency]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — NO stored token/password
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
          # OIDC trusted publishing: the `environment: pypi` deployment must be
          # mapped to the `knovaryn` PyPI project in PyPI's trusted publishers
          # settings. No PYPI_API_TOKEN secret is stored or referenced.
