# Builds + verifies the wheel/sdist (L7) and publishes it to PyPI via **OIDC
# trusted publishing** (L8) once a maintainer publishes a GitHub Release.
# Nothing publishes automatically on plain `main` commits — publishing is an
# explicit, release-gated action (contract rule 22).
#
# L9 release safeguards, in one pipeline:
#   - only a `release` event triggers publish (manual Release gate)
#   - the `package-ci` job runs scripts/package_ci.py (build, twine check,
#     metadata, secret-scan, clean-env install, CLI/MCP/REST smoke) and must
#     pass before anything is uploaded
#   - the tag must be a clean `vX.Y.Z` semver and match the package version
#   - any secret-like content in the wheel fails the job (fail closed)
#   - publish uses OIDC (id-token: write) — no stored password/token secret
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-ci:
    name: Package CI (L7 — build + verify release candidate)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install dev + mcp extras
        run: uv sync --extra dev --extra mcp
      - name: Build + verify + smoke (wheel/sdist/twine/meta/secrets/CLI/MCP/REST)
        run: uv run python scripts/package_ci.py

  tag-version-consistency:
    name: Release tag matches package version (L9)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Check tag == project version
        run: |
          VERSION="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          REF="${GITHUB_REF#refs/tags/v}"
          echo "tag=v${REF}  project=${VERSION}"
          test "$REF" = "$VERSION" || { echo "tag does not match project version"; exit 1; }

  # Defect 4.12: the release SHA must have PASSED CI before anything is built
  # or uploaded. This gate resolves the tag's commit and demands every job in
  # ci.yml concluded SUCCESS on exactly that SHA (fails closed on failed,
  # missing, or still-running checks).
  ci-gate:
    name: Release SHA passed CI (L9)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Verify all required CI checks passed on the release SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --with pyyaml python scripts/release_governance.py "${{ github.sha }}" --repo "${{ github.repository }}"

  build:
    name: Build wheel & sdist
    needs: [package-ci, tag-version-consistency, ci-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Build distributions
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Defect 4.13 family: a release carries MORE than the PyPI upload —
  # detached checksums and an SBOM are attached to the GitHub Release itself,
  # so consumers can verify what they downloaded without trusting PyPI.
  # (Provenance attestations for the wheel/sdist are produced by the PyPI
  # trusted-publishing step below; PyPI stores and serves them.)
  release-assets:
    name: Attach checksums + SBOM to the release
    needs: [build, ci-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # upload files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Generate detached SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Generate SBOM from the locked resolution
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt
          uv run --with cyclonedx-bom cyclonedx-py requirements --pyproject pyproject.toml --of JSON -o sbom.cdx.json requirements.txt
      - name: Attach SHA256SUMS + SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS sbom.cdx.json --clobber

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — NO stored token/password
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
          # OIDC trusted publishing: the `environment: pypi` deployment must be
          # mapped to the `knovaryn` PyPI project in PyPI's trusted publishers
          # settings. No PYPI_API_TOKEN secret is stored or referenced.
