# Knovaryn CI (spec WP L1/L2/L3/L4).
#
# Layers:
#   lint-type      — ruff lint + format + mypy (fast; not per-version)
#   test           — full offline suite on the Python matrix (3.11 / 3.12 / 3.13)
#   test-tiers     — each test tier (unit/integration/mcp/rest/chaos/release) as
#                    an isolated job so a failure is attributed to one tier
#   coverage       — branch-coverage gate on core code (L3)
#   platform-smoke — Windows + macOS build/import/CLI/local-storage smoke (L1)
#   container      — build the image (main only)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch + the weekly cron exist so the compose E2E (defect 4.11)
  # runs on a schedule and on demand — it boots the real container topology
  # and is too heavy for every PR push.
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint, format & type (L4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: uv sync --extra dev
      # §8.2/§8.5: a stale lockfile must fail loudly, not conceal a widened
      # dependency range behind an outdated resolution.
      - name: Lockfile freshness (uv lock --check)
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src

  test:
    name: Tests (offline) — py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra dev --extra mcp
      - name: Offline test suite (full)
        run: >-
          uv run pytest -q -p no:cacheprovider
          -m "not live and not live-provider and not release and not docling
          and not docetl and not postgres and not s3 and not browser"
      - name: Coverage report (informational)
        run: uv run pytest --cov=knovaryn --cov-report=term-missing

  test-tiers:
    name: Tier ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: lint-type
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: unit
          - tier: integration
          - tier: mcp
          - tier: rest
          - tier: chaos
          - tier: release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install (release/mcp extras for those tiers)
        run: uv sync --extra dev --extra mcp
      - name: Run tier ${{ matrix.tier }}
        run: uv run pytest -q -p no:cacheprovider -m "${{ matrix.tier }}"

  coverage:
    name: Coverage gate (L3)
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install
        # Same extras as the offline test job: the gate must measure the SAME
        # suite configuration that is required to pass, or a missing optional
        # dependency here produces failures the test job never sees (caught
        # 2026-08-21: dev-only install measured quality/semantic.py at its
        # pre-fix coverage while the dev+mcp test job was green).
        run: uv sync --extra dev --extra mcp
      - name: Run branch-coverage gate on core code
        run: uv run python scripts/coverage_gate.py

  platform-smoke:
    name: Smoke — ${{ matrix.os }} (L1)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install (dev extras for the storage/migration pytest smoke)
        run: uv sync --extra dev
      - name: Path / CLI import smoke
        run: uv run python -c "import knovaryn,sys; print(knovaryn.__file__); from knovaryn.interfaces.cli.main import app; print('import ok')"
      - name: Local storage smoke (CAS + DB + worker repo)
        shell: bash
        run: uv run python -m pytest tests/test_artifact_store.py tests/test_migrations.py -q -p no:cacheprovider
      - name: Offline demo smoke
        run: uv run knovaryn demo --examples 10 --json

  docs:
    name: Docs build & link check (L6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install mkdocs + material
        run: uv sync --extra dev
      - name: Build docs site
        run: uv run mkdocs build --strict
      # Defect 3.3: internal links/fragments/images are BLOCKING (was `|| true`).
      - name: Blocking internal link check (README + docs + llms.txt + generated HTML)
        run: uv run scripts/check_links.py --site site
      # External URLs: retried (config), anti-bot allowlisted, informational so
      # provider flakiness cannot fail CI — but never silently swallowed.
      - name: External link check (informational, retrying)
        continue-on-error: true
        run: uv run --with markdown-link-check markdown-link-check --config=$(pwd)/.mlc-config.json $(find docs README.md -name '*.md' -o -name 'README.md')
      # §6.5: alt text, source/artifact parity, social-card geometry,
      # count-free diagrams. Byte-exact render drift runs in assets.yml.
      - name: Asset consistency checks (§6.5)
        run: uv run scripts/check_assets.py

  container:
    name: Build container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t knovaryn:ci .

  # §8.8/§8.10: every declared installation profile installs independently,
  # imports what it promises (and nothing it doesn't), and answers on the
  # real CLI surface. `core` additionally forbids heavy extras sneaking in.
  extras:
    name: Install profile — ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            install: "."
            forbid: "--forbid-extra docling --forbid-extra mcp --forbid-extra litellm"
          - profile: mcp
            install: ".[mcp]"
            forbid: ""
          - profile: docling
            install: ".[docling]"
            forbid: ""
          - profile: docetl
            install: ".[docetl]"
            forbid: ""
          - profile: litellm
            install: ".[litellm]"
            forbid: ""
          - profile: s3
            install: ".[s3]"
            forbid: ""
          - profile: parquet
            install: ".[parquet]"
            forbid: ""
          - profile: hub
            install: ".[hub]"
            forbid: ""
          - profile: ml
            install: ".[ml]"
            forbid: ""
          - profile: full
            install: ".[full]"
            forbid: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      # A dedicated venv per profile: the smoke runs under THIS profile's
      # interpreter so its imports prove what the installation carries.
      - name: Install exactly this profile
        run: |
          uv venv "$RUNNER_TEMP/profile-venv" --python 3.11
          # quoted: ".[mcp]" contains brackets the shell would otherwise glob
          uv pip install --python "$RUNNER_TEMP/profile-venv/bin/python" "${{ matrix.install }}"
      - name: Profile smoke (imports + probes + doctor)
        run: >-
          "$RUNNER_TEMP/profile-venv/bin/python" scripts/profile_smoke.py
          ${{ matrix.profile }} ${{ matrix.forbid }}

  # §3.10: the deployment E2E is a REUSABLE exact-SHA workflow shared with the
  # release gate (publish.yml). Ordinary pushes skip it (too heavy); weekly and
  # on dispatch it boots the real production topology so it cannot rot.
  compose-e2e:
    name: Compose E2E (deployed topology)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-e2e.yml
