[project]
name = "knovaryn"
# Single authoritative version source (defect 3.5): the literal lives in
# src/knovaryn/__init__.py and hatchling consumes it at build time, so
# pyproject cannot drift from the package metadata.
dynamic = ["version"]
description = "Open, MCP-native training-data foundry: turn permitted documents into traceable, quality-gated SFT and preference datasets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Knovaryn maintainers" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "training-data",
    "llm-training-data",
    "synthetic-data",
    "sft",
    "dpo",
    "rlhf",
    "kto",
    "preference-data",
    "dataset",
    "dataset-provenance",
    "data-lineage",
    "fine-tuning",
    "huggingface",
    "docling",
    "llmops",
    "mlops",
    "data-quality",
    "dataset-curation",
    "ai-agents",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    # Floor is 3.13-verified: 2.0.30 and below fail at import on CPython 3.13
    # (TypingOnly vs PEP-649 class attrs); 2.0.31 passes the async round-trip
    # probe in scripts/compat_matrix.py. Floors must hold on every supported
    # interpreter, not just the oldest one.
    "sqlalchemy[asyncio]>=2.0.31",
    "aiosqlite>=0.20",
    "asyncpg>=0.29; platform_system != 'Windows'",
    "alembic>=1.13",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "structlog>=24.1",
    "uuid6>=2024.7.10",
]

[project.scripts]
knovaryn = "knovaryn.interfaces.cli.main:app"
knovaryn-mcp = "knovaryn.interfaces.mcp.__main__:main"

[project.optional-dependencies]
# Heavy/opt-in extras are NOT required for the offline demo or CI (fake provider).
docling = [
    "docling>=2.26",
]
docetl = [
    "docetl>=0.1",
]
litellm = [
    "litellm>=1.45",
]
s3 = [
    "aioboto3>=13",
]
parquet = [
    "pyarrow>=16",
]
hub = [
    "huggingface-hub>=0.23",
]
mcp = [
    "mcp>=1.28,<3",
]
ml = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
# Contract §8.9: one extra pulling in every documented production feature,
# so a full-runtime deployment is a single, CI-tested installation profile
# (see the `extras` job and scripts/profile_smoke.py).
full = [
    "docling>=2.26",
    "docetl>=0.1",
    "litellm>=1.45",
    "aioboto3>=13",
    "pyarrow>=16",
    "huggingface-hub>=0.23",
    "mcp>=1.28,<3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "mcp>=1.28,<3",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "mkdocs>=1.6",
    "aioresponses>=0.7",
    "respx>=0.21",
    "build>=1.2",
    "twine>=5.0",
    "pip-audit>=2.7",
]
# Visual/brand asset pipeline and browser verification (scripts/visuals/,
# scripts/check_visual_assets.py, tests/browser/). Dev-only: never installed
# by end users.
visuals = [
    "playwright>=1.49",
    # Animated-GIF assembly (offline-demo.gif) and PNG optimization
    # (scripts/visuals/optimize_assets.py). Dev-only asset tooling.
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://waalwalker1.github.io/knovaryn/"
Documentation = "https://waalwalker1.github.io/knovaryn/"
Repository = "https://github.com/waalwalker1/knovaryn"
Issues = "https://github.com/waalwalker1/knovaryn/issues"
Changelog = "https://github.com/waalwalker1/knovaryn/blob/main/CHANGELOG.md"
Security = "https://github.com/waalwalker1/knovaryn/blob/main/SECURITY.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/knovaryn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/knovaryn"]

[tool.hatch.build.targets.sdist]
# Dot-directories are tool state or private material, never package content.
# Hatchling's VCS filter honors .gitignore but not local-only excludes
# (.git/info/exclude), so working-tree dot-dirs would otherwise ride into the
# sdist. Cut them generically — this file names no private path.
# `knovaryn-demo` is runtime output of the offline demo command (logs,
# result JSON, release zip): generated state, never package content, even
# when present and untracked at build time.
exclude = [".*", ".gitignore", "knovaryn-demo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM", "B008"]
ignore = ["B008"]
# The web console is a single self-contained HTML template; its lines are part
# of a static string literal and must not be reflowed, so E501 is per-file
# ignored there (code in the module still satisfies line-length).
[tool.ruff.lint.per-file-ignores]
"src/knovaryn/interfaces/rest/webconsole.py" = ["E501"]
# Operational scripts carry long subprocess/command literals that should not be
# reflowed; code in them still satisfies the 100-char style except these lines.
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
# Optional/third-party deps (docling, docetl, litellm, mcp, torch, pandas,
# aiofiles, huggingface_hub, aioboto3, yaml) are not always installed in the
# type-check env and have no stubs there. Missing-import ignores are scoped to
# those modules only (per-module), NOT applied globally — first-party modules
# must resolve, so we never globally silence a missing first-party import (L4).
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = ["migrations/versions/", "tests/", "benchmarks/"]

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "docetl.*",
    "litellm.*",
    "mcp.*",
    "yaml",
    "torch.*",
    "pandas.*",
    "aiofiles.*",
    "huggingface_hub.*",
    "aioboto3.*",
    "uvicorn.*",
    "structlog.*",
    "uuid6.*",
]
ignore_missing_imports = true

[tool.uv]
# Contract §8.1: pin the resolution-toolchain policy. Lockfile format and
# resolution semantics are uv-generation-dependent; letting CI and
# contributors drift across major uv versions makes `uv.lock` silently
# non-reproducible. Bump deliberately, together with `uv.lock`.
required-version = ">=0.12"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# importlib import mode: tests/ has no __init__.py (intentionally), and two
# same-basename modules exist at different depths
# (tests/test_version_sync.py, tests/public/test_version_sync.py) — the
# default prepend mode collides them in sys.modules ("import file mismatch",
# whole-suite collection error). importlib resolves each by its path-derived
# name and is the pytest-documented layout for this tree shape.
addopts = "-ra --strict-markers --import-mode=importlib"
# §9 warnings-as-errors policy (v0.2.1): the async-shutdown defect class
# (leaked aiosqlite worker threads resolving futures against closed event
# loops, unraisable exceptions during teardown) must fail tests loudly, never
# scroll past as warnings. The one ignore below is a third-party shim outside
# Knovaryn's control: fastapi re-exports starlette's TestClient and starlette
# deprecates whichever httpx line it finds installed — decided by the SDK
# closure, not by our code.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "unit: fast semantic unit tests (no external services)",
    "integration: integration tests across repositories/pipeline",
    "mcp: MCP server client-server tests",
    "rest: REST API lifecycle tests",
    "docling: requires docling extra",
    "docetl: requires docetl extra",
    "browser: browser E2E tests",
    "postgres: requires PostgreSQL",
    "s3: requires s3 extra",
    "live: opt-in tests requiring external credentials (skip by default)",
    "live-provider: opt-in live model-provider contract tests (skip by default)",
    "chaos: crash/kill/lease recovery tests",
    "deployment: boots the real compose stack (opt-in via KNOVARYN_E2E_COMPOSE=1)",
    "release: wheel/clean-install/release-integrity tests",
]

[tool.coverage.run]
source = ["knovaryn"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hatch.metadata]
allow-direct-references = true
