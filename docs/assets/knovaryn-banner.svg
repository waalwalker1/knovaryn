<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Knovaryn — from documents to defensible training data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0d2b3a"/>
      <stop offset="1" stop-color="#0a3b46"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>

  <!-- ===== clean monogram tile ===== -->
  <g transform="translate(150,120)">
    <rect width="160" height="160" rx="36" fill="url(#tile)"/>
    <!-- minimal "K" built from three clean strokes -->
    <path d="M 52 44 L 52 116" stroke="#06283d" stroke-width="15" stroke-linecap="round"/>
    <path d="M 58 90 L 108 48" stroke="#06283d" stroke-width="15" stroke-linecap="round"/>
    <path d="M 58 90 L 108 132" stroke="#06283d" stroke-width="15" stroke-linecap="round"/>
    <!-- small quality "accepted" check in the bottom-right of the tile -->
    <circle cx="128" cy="132" r="26" fill="#06283d"/>
    <path d="M 116 132 L 124 140 L 140 122" stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== subtle provenance link: source dots -> single refined point ===== -->
  <line x1="330" y1="200" x2="362" y2="200" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="312" cy="200" r="4" fill="#38bdf8" fill-opacity="0.55"/>
  <circle cx="296" cy="200" r="3" fill="#38bdf8" fill-opacity="0.38"/>
  <circle cx="283" cy="200" r="2" fill="#38bdf8" fill-opacity="0.22"/>

  <!-- ===== wordmark + tagline ===== -->
  <g transform="translate(400,196)">
    <text x="0" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Knovaryn</text>
    <text x="0" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="400" fill="#7dd3fc">From documents to <tspan fill="#34d399" font-weight="600">defensible training data</tspan></text>
  </g>

  <!-- ===== capability pills ===== -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="500" transform="translate(400,330)">
    <rect x="0"   y="0" width="150" height="44" rx="22" fill="#12384a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="75"  y="28" fill="#e0f2fe" text-anchor="middle">MCP-native</text>
    <rect x="170" y="0" width="166" height="44" rx="22" fill="#12384a" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="253" y="28" fill="#d1fae5" text-anchor="middle">Offline-first</text>
    <rect x="356" y="0" width="140" height="44" rx="22" fill="#12384a" stroke="#94a3b8" stroke-opacity="0.35"/>
    <text x="426" y="28" fill="#cbd5e1" text-anchor="middle">Apache-2.0</text>
  </g>
</svg>
