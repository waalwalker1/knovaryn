# MinIO — S3-compatible object store for content-addressed artifacts (K1/K3).
# The app's `storage.artifact_backend: s3` points at this endpoint. For a
# managed alternative, point `s3_endpoint` at AWS S3 / GCS / Azure Blob instead
# and drop this StatefulSet + PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: knovaryn
  labels:
    app: knovaryn
    component: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      component: minio
  template:
    metadata:
      labels:
        component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # minio image user
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # pinned
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: knovaryn-secrets
                  key: s3_access_key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knovaryn-secrets
                  key: s3_secret_key
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: knovaryn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: knovaryn
  labels:
    component: minio
spec:
  selector:
    component: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
