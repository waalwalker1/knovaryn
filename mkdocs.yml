site_name: Knovaryn
site_description: >-
  Open, MCP-native training-data foundry: turn permitted documents into
  traceable, quality-gated SFT and preference datasets.
site_url: https://waalwalker1.github.io/knovaryn/
repo_url: https://github.com/waalwalker1/knovaryn
edit_uri: edit/main/docs/

# Authoritative product version (defect 3.5): kept equal to
# knovaryn.__version__ by scripts/check_version_sync.py, enforced by
# tests/public/test_version_sync.py.
extra:
  version: 0.2.1

theme:
  name: material
  custom_dir: overrides
  # Brand favicon (§15 governance: favicon presence). Generated by
  # scripts/visuals/build_brand_assets.py from the Tracemark symbol.
  favicon: assets/brand/favicon.svg
  # No webfonts: the site must make zero third-party requests (§19 privacy,
  # docs/design-system/typography.md). System stacks come from tokens.css.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.path  # breadcrumbs above the article (§11.11)
    - navigation.footer  # visible prev/next article links (§11.11)
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  # NOTE: deliberately NO `repo_name`/repository *widget* beyond the icon
  # link. Material's `data-md-component="source"` widget fetches
  # api.github.com on every page view (stars/forks/version) — a third-party
  # request §16.2/§19 forbid without documented approval, and a live
  # stars counter is popularity signaling the project does not claim.
  # `repo_url` still renders as a plain GitHub icon link in the header.

plugins:
  - search

# Brand working docs inside the assets tree are for contributors reading the
# repo, not site pages (§11.11): exclude them instead of nav-listing them.
exclude_docs: |
  assets/brand/README.md
  assets/brand/brand-guidelines.md

# Knovaryn design tokens (docs/design-system/) — applied after the theme's
# own styles so the brand palette, type, focus and motion tokens win, plus
# the component classes implementing docs/design-system/components.md.
extra_css:
  - assets/design-system/tokens.css
  - assets/design-system/components.css

markdown_extensions:
  - admonition
  - attr_list  # {: width="100%"} on markdown images (raw-HTML srcs are not rewritten at build)
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid: JS-rendered in the browser; with JavaScript disabled the raw
  # fenced source remains visible as a textual fallback (§11.7).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

