site_name: Knovaryn
site_description: >-
  Open, MCP-native training-data foundry: turn permitted documents into
  traceable, quality-gated SFT and preference datasets.
site_url: https://waalwalker1.github.io/knovaryn/
repo_url: https://github.com/waalwalker1/knovaryn
edit_uri: edit/main/docs/

# Authoritative product version (defect 3.5): kept equal to
# knovaryn.__version__ by scripts/check_version_sync.py, enforced by
# tests/public/test_version_sync.py.
extra:
  version: 0.2.1

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list  # {: width="100%"} on markdown images (raw-HTML srcs are not rewritten at build)
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Knovaryn MCP (umbrella): knovaryn-mcp.md
  - Concepts:
      - Overview: concepts/overview.md
      - Dataset provenance: concepts/dataset-provenance.md
      - Quality gates: concepts/quality-gates.md
      - License & privacy: concepts/license-and-privacy.md
      - Provenance (deep dive): concepts/provenance.md
      - Quality (deep dive): concepts/quality.md
      - Preference data: concepts/preference-data.md
  - Architecture:
      - Overview: architecture/overview.md
      - Durable jobs: architecture/jobs.md
      - Data flow: architecture/diagram.md
      - Security: architecture/security.md
      - At a glance (diagrams): architecture/readme-diagrams.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - First real project: guides/first-real-project.md
      - MCP clients: guides/mcp-clients.md
      - MCP training-data server: guides/mcp-training-data-server.md
      - PDF to SFT dataset: guides/pdf-to-sft-dataset.md
      - Build DPO preference data: guides/build-dpo-preference-data.md
      - Grounded QA datasets: guides/grounded-qa-dataset-from-documents.md
      - Hugging Face export: guides/hugging-face-export.md
  - Comparisons:
      - Peer landscape: peers/index.md
      - vs Synthetic Data Kit: comparisons/synthetic-data-kit.md
      - vs Distilabel: comparisons/distilabel.md
      - vs Docling SDK: comparisons/docling-sdg.md
      - vs Easy Dataset: comparisons/easy-dataset.md
  - Support & FAQ: support.md
  - Deployment:
      - Profiles: deployment/profiles.md
      - Docker: deployment/docker.md
  - Security:
      - Hardening: security/hardening.md
      - Privacy & licensing: security/privacy-licensing.md
      - Governance & CI: security/governance-and-ci.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/config.md
      - REST API: reference/rest-api.md
      - MCP tools: reference/mcp-tools.md
      - Quality gates: reference/quality-gates.md
      - Validation profiles: reference/profiles.md
      - Exporters: reference/exporters.md
      - Claim matrix: reference/claim-matrix.md
  - ADRs:
      - Index: adr/index.md
      - ADR-0001 Dependency baseline: adr/0001-dependency-baseline.md
      - ADR-0002 MCP & FastMCP: adr/0002-mcp-and-fastmcp.md
      - ADR-0003 Docling resource guard: adr/0003-docling-resource-guard.md
      - ADR-0004 DocETL profile: adr/0004-docetl-profile.md
      - ADR-0005 LiteLLM & providers: adr/0005-litellm-and-providers.md
      - ADR-0006 Storage backends: adr/0006-storage-backends.md
